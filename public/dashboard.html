<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría SNL Progesys</title>
<style>
  :root{
    --page:#f7f6f2; --surface:#ffffff; --surface-2:#f1efe9;
    --ink:#16201f; --ink-2:#52625f; --ink-3:#8a9793;
    --border:rgba(22,32,31,0.12); --border-strong:rgba(22,32,31,0.20);
    --accent:#0f6b62; --accent-ink:#ffffff; --accent-soft:#e4f2ef; --accent-soft-ink:#0f6b62;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:#e4f6e0; --warning-soft:#fff3d6; --serious-soft:#fde5da; --critical-soft:#fbe1e1;
    --good-ink:#0c6b0c; --warning-ink:#8a5c00; --serious-ink:#a6431f; --critical-ink:#a12222;
    --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; --m5:#e87ba4;
    --rail-bg:#0d1615; --rail-ink:#eef4f2; --rail-ink-2:#9fb3ae; --rail-active:#16302c;
    --shadow:0 1px 2px rgba(16,25,24,0.06), 0 8px 24px -12px rgba(16,25,24,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#0d1211; --surface:#141b1a; --surface-2:#1a2322;
      --ink:#eef4f2; --ink-2:#b9c6c3; --ink-3:#7c8b88;
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
      --accent:#3fb3a4; --accent-ink:#04211d; --accent-soft:#16302c; --accent-soft-ink:#6fd3c4;
      --good:#22b522; --warning:#fab219; --serious:#f0906a; --critical:#e66767;
      --good-soft:#123018; --warning-soft:#332405; --serious-soft:#3a1f15; --critical-soft:#3a1414;
      --good-ink:#7fe07f; --warning-ink:#ffcf6b; --serious-ink:#ffab84; --critical-ink:#ff9c9c;
      --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --page:#0d1211; --surface:#141b1a; --surface-2:#1a2322;
    --ink:#eef4f2; --ink-2:#b9c6c3; --ink-3:#7c8b88;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --accent:#3fb3a4; --accent-ink:#04211d; --accent-soft:#16302c; --accent-soft-ink:#6fd3c4;
    --good:#22b522; --warning:#fab219; --serious:#f0906a; --critical:#e66767;
    --good-soft:#123018; --warning-soft:#332405; --serious-soft:#3a1f15; --critical-soft:#3a1414;
    --good-ink:#7fe07f; --warning-ink:#ffcf6b; --serious-ink:#ffab84; --critical-ink:#ff9c9c;
    --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; --m5:#d55181;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    text-wrap:balance; margin:0;
  }
  .tabular{ font-variant-numeric: tabular-nums; }
  a{color:inherit;}

  .app{ display:flex; min-height:100vh; }

  /* ---------- Rail / sidebar ---------- */
  .rail{
    width:248px; flex:0 0 248px; background:var(--rail-bg); color:var(--rail-ink);
    display:flex; flex-direction:column; padding:22px 14px; gap:4px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-brand{ padding:6px 10px 20px; }
  .rail-brand .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg,#3fb3a4,#0f6b62);
    font-size:17px; margin-bottom:10px;
  }
  .rail-brand .word{ font-family:"Iowan Old Style",Georgia,serif; font-size:19px; letter-spacing:0.01em; color:#fff; }
  .rail-brand .sub{ font-size:11.5px; color:var(--rail-ink-2); margin-top:2px; line-height:1.4; }
  .rail-nav{ display:flex; flex-direction:column; gap:2px; margin-top:6px; }
  .rail-btn{
    display:flex; align-items:center; gap:10px; text-align:left;
    padding:10px 12px; border-radius:9px; border:none; background:transparent;
    color:var(--rail-ink-2); font-size:13.5px; font-weight:500; cursor:pointer;
    font-family:inherit;
  }
  .rail-btn .ic{ font-size:15px; width:18px; text-align:center; }
  .rail-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .rail-btn.active{ background:var(--rail-active); color:#fff; }
  .rail-btn .cnt{
    margin-left:auto; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px;
    background:rgba(255,255,255,0.08); color:var(--rail-ink-2);
  }
  .rail-btn.active .cnt{ background:rgba(255,255,255,0.16); color:#fff; }
  .rail-foot{ margin-top:auto; padding:12px 10px 4px; font-size:11px; color:var(--rail-ink-2); line-height:1.6; border-top:1px solid rgba(255,255,255,0.08); }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:30px 40px 80px; max-width:1180px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
  .topbar h1{ font-size:26px; }
  .topbar .ref{ font-size:12.5px; color:var(--ink-3); }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .panel.active{ animation:none; } }

  .lede{ color:var(--ink-2); font-size:14.5px; max-width:66ch; line-height:1.55; margin-bottom:22px; }

  /* KPI row */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:26px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .kpi .lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600; }
  .kpi .val{ font-size:28px; font-weight:600; margin-top:6px; }
  .kpi .val small{ font-size:14px; font-weight:500; color:var(--ink-2); margin-left:3px; }
  .kpi .delta{ font-size:12px; margin-top:4px; color:var(--ink-2); }

  .section-title{ font-size:15px; font-weight:700; margin:30px 0 12px; display:flex; align-items:center; gap:8px; }
  .section-title .n{ color:var(--ink-3); font-weight:500; font-size:12.5px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .pad{ padding:18px 20px; }

  /* issue rows (sparkbar table) */
  .issue-row{ display:grid; grid-template-columns:1.6fr 3fr auto auto; gap:14px; align-items:center; padding:11px 20px; border-top:1px solid var(--border); }
  .issue-row:first-child{ border-top:none; }
  .issue-row .name{ font-size:13.5px; font-weight:600; }
  .issue-row .track{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .issue-row .fill{ height:100%; border-radius:99px; }
  .issue-row .count{ font-size:13px; font-weight:700; text-align:right; min-width:34px; }
  .pill{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; letter-spacing:.01em; }
  .pill.good{ background:var(--good-soft); color:var(--good-ink); }
  .pill.warning{ background:var(--warning-soft); color:var(--warning-ink); }
  .pill.serious{ background:var(--serious-soft); color:var(--serious-ink); }
  .pill.critical{ background:var(--critical-soft); color:var(--critical-ink); }

  /* compare bars (module vs module) */
  .cmp-row{ display:grid; grid-template-columns:150px 1fr 70px; gap:14px; align-items:center; padding:9px 0; }
  .cmp-row .track{ height:14px; background:var(--surface-2); border-radius:5px; overflow:hidden; display:flex; }
  .cmp-row .seg{ height:100%; }
  .cmp-row .name{ font-size:13px; font-weight:600; }
  .cmp-row .total{ font-size:12.5px; color:var(--ink-2); text-align:right; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-2); }
  .legend .sw{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }

  .grid2{ display:grid; grid-template-columns:1.15fr .85fr; gap:16px; }
  @media (max-width:860px){ .grid2{ grid-template-columns:1fr; } }

  .obs-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:640px){ .obs-grid{ grid-template-columns:1fr; } }
  .obs{ background:var(--surface-2); border-radius:10px; padding:12px 14px; }
  .obs .k{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700; margin-bottom:4px; }
  .obs .v{ font-size:13px; line-height:1.45; color:var(--ink); }

  .cause{ border-top:1px solid var(--border); padding:16px 20px; display:grid; grid-template-columns:26px 1fr; gap:12px; }
  .cause:first-child{ border-top:none; }
  .cause .dot{ width:10px; height:10px; border-radius:50%; margin-top:6px; }
  .cause h4{ font-size:14px; margin:0 0 4px; font-family:system-ui,sans-serif; font-weight:700; }
  .cause p{ font-size:13px; color:var(--ink-2); line-height:1.55; margin:0 0 6px; }
  .cause .sol{ font-size:13px; color:var(--ink); background:var(--accent-soft); color:var(--accent-soft-ink); padding:8px 12px; border-radius:8px; line-height:1.5; }
  .cause .sol b{ font-weight:700; }

  .banner{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px 20px; margin-bottom:26px; box-shadow:var(--shadow);
  }
  .banner .icon{ font-size:26px; }
  .banner .txt{ font-size:13px; color:var(--ink-2); line-height:1.5; }
  .banner .txt b{ color:var(--ink); }

  .foot-note{ font-size:11.5px; color:var(--ink-3); margin-top:34px; line-height:1.6; border-top:1px solid var(--border); padding-top:14px; }

  .privacy-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    background:var(--accent-soft); color:var(--accent-soft-ink); padding:5px 11px; border-radius:99px;
  }

  table.rutdef{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rutdef th{ text-align:left; color:var(--ink-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:10.5px; padding:0 0 8px; }
  table.rutdef td{ padding:9px 0; border-top:1px solid var(--border); color:var(--ink-2); }
  table.rutdef td.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); }
  table.rutdef tr.clickable{ cursor:pointer; }
  table.rutdef tr.clickable:hover td{ color:var(--ink); }

  /* clickable rows / kpis that open the RUT detail modal */
  .clickable{ cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .kpi.clickable:hover{ box-shadow:var(--shadow), 0 0 0 2px var(--accent) inset; }
  .issue-row.clickable:hover{ background:var(--surface-2); }
  .clickable .hint{ font-size:10.5px; color:var(--accent); font-weight:700; margin-top:6px; display:flex; align-items:center; gap:3px; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,13,0.55); backdrop-filter:blur(1px);
    display:none; align-items:flex-start; justify-content:center; padding:6vh 20px; z-index:50; overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:16px;
    width:100%; max-width:840px; box-shadow:0 20px 60px -20px rgba(0,0,0,0.4); overflow:hidden;
  }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-family:"Iowan Old Style",Georgia,serif; font-size:18px; }
  .modal-head p{ margin:6px 0 0; font-size:12.5px; color:var(--ink-2); max-width:56ch; line-height:1.5; }
  .modal-close{
    border:none; background:var(--surface-2); color:var(--ink-2); width:30px; height:30px; border-radius:9px;
    font-size:15px; cursor:pointer; flex:0 0 auto;
  }
  .modal-close:hover{ background:var(--border-strong); color:var(--ink); }
  .modal-body{ max-height:60vh; overflow-y:auto; }
  table.detail{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.detail thead th{
    position:sticky; top:0; background:var(--surface); text-align:left; color:var(--ink-3); font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; font-size:10px; padding:10px 22px; border-bottom:1px solid var(--border);
  }
  table.detail tbody td{ padding:10px 22px; border-top:1px solid var(--border); vertical-align:top; }
  table.detail tbody tr:hover td{ background:var(--surface-2); }
  table.detail td.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); white-space:nowrap; }
  table.detail td.arrow{ color:var(--ink-3); }
  table.detail td.fix{ color:var(--good-ink); font-weight:700; }
  .modal-foot{ padding:12px 22px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-3); }

  table.detail tbody tr[data-fila]{ cursor:pointer; }
  table.detail tbody tr[data-fila]:hover td{ background:var(--accent-soft); }
  table.detail tbody tr[data-fila] td:first-child{ position:relative; }

  dl.record-fields{ margin:0; display:grid; grid-template-columns:1fr; }
  dl.record-fields .row{ display:grid; grid-template-columns:150px 1fr; gap:14px; padding:11px 22px; border-top:1px solid var(--border); align-items:start; }
  dl.record-fields .row:first-child{ border-top:none; }
  dl.record-fields dt{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700; margin:0; padding-top:1px; }
  dl.record-fields dd{ margin:0; font-size:13.5px; color:var(--ink); line-height:1.5; }
  dl.record-fields dd.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  dl.record-fields dd.muted{ color:var(--ink-3); }

  .excel-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-ink);
    font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:9px; text-decoration:none; white-space:nowrap;
  }
  .excel-btn:hover{ opacity:.9; }
</style>
</head>
<body>

<div class="app">
  <nav class="rail">
    <div class="rail-brand">
      <div class="mark">🩺</div>
      <div class="word">Progesys</div>
      <div class="sub">Auditoría de datos<br>Solicitudes SNL</div>
    </div>
    <div class="rail-nav" id="railNav"></div>
    <div class="rail-foot">
      Referencia de fechas: 15‑08‑2026<br>
      Fuente: base interna de solicitudes (Neon)<br>
      <a href="/manual" style="color:var(--rail-ink-2);">📘 Manual de uso</a> ·
      <a href="/logout" style="color:var(--rail-ink-2);">Cerrar sesión</a>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">RUT mal escritos</h3>
        <p id="modalSubtitle"></p>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <table class="detail">
        <thead id="modalHead"><tr><th>Módulo</th><th>Fila en base</th><th>Nombre</th><th>RUT ingresado</th><th>Error</th><th>Corrección sugerida</th></tr></thead>
        <tbody id="modalBody"></tbody>
      </table>
    </div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="modal-overlay" id="recordOverlay" style="z-index:60;">
  <div class="modal" style="max-width:520px;">
    <div class="modal-head">
      <div>
        <p style="margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700;" id="recordEyebrow"></p>
        <h3 id="recordTitle">Detalle del registro</h3>
      </div>
      <button class="modal-close" id="recordClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" style="max-height:64vh;">
      <dl class="record-fields" id="recordFields"></dl>
    </div>
    <div class="modal-foot" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <span id="recordFoot" style="color:var(--ink-3);"></span>
      <a id="recordExcelBtn" href="#" target="_blank" rel="noopener" class="excel-btn">📊 Abrir en la planilla</a>
    </div>
  </div>
</div>

<script>
const MOD_LABEL = {reembolsos:"Reembolsos", informes:"Informes Médicos", otras:"Otras Solicitudes", cd:"CD Pendiente", pacienteep:"Paciente Derivado EP"};
const SEV_LABEL = {good:"OK", warning:"MEDIA", serious:"ALTA", critical:"CRÍTICA"};
const TIPO_LABEL = {vacio:"Campo vacío", formato:"Formato no reconocible", dv:"Dígito verificador incorrecto"};
const TIPO_SEV = {vacio:"warning", formato:"serious", dv:"critical"};
const SHEET_NAME = {reembolsos:"Reembolsos", informes:"CDPendiente_BASE", otras:"Otras solicitudes", cd:"Cita pendiente Conf.Diag", pacienteep:"Paciente derivado EP"};

let EXCEL_SHARE_LINK = "";
function buildExcelLink(mod, fila){
  const sheet = SHEET_NAME[mod];
  const cellRef = "'" + sheet + "'!A" + fila;
  const sep = EXCEL_SHARE_LINK.includes("?") ? "&" : "?";
  return EXCEL_SHARE_LINK + sep + "activeCell=" + encodeURIComponent(cellRef) + "&wdActiveSheet=" + encodeURIComponent(sheet);
}

let MODULES, MASTER_DATA, BAD_RUTS, CAUSAS;
let RUT_TOTAL, RUT_VALIDO, RUT_VACIO, RUT_FORMATO, RUT_DV, RUT_MAL;
let GESTION_TOTAL, GESTION_CON, GESTION_SIN, DUP_GRUPOS_TOTAL, PRUEBA_TOTAL;

function deriveData(payload){
  MASTER_DATA = payload.master;
  EXCEL_SHARE_LINK = payload.excelShareLink || "";
  CAUSAS = payload.causas;

  BAD_RUTS = [];

  for(const [mod, rows] of Object.entries(MASTER_DATA)){
    for(const r of rows){
      if(r.rutEstado !== 'valido'){
        BAD_RUTS.push({mod, modLabel:MOD_LABEL[mod], fila:r.fila, nombre:r.nombre, rut: r.rut || '(vacío)', tipo:r.rutEstado, sugerencia:r.rutSugerencia});
      }
    }
  }

  const MOD_ORDER = ["reembolsos","informes","otras","cd","pacienteep"];
  const orderedMeta = payload.modulesMeta.slice().sort((a,b)=> MOD_ORDER.indexOf(a.id) - MOD_ORDER.indexOf(b.id));
  MODULES = orderedMeta.map(m => {
    const rows = MASTER_DATA[m.id] || [];
    const sinError = rows.filter(r=>r.incOk).length;
    return {
      id: m.id, nombre: m.nombre, icon: m.icon, descripcion: m.descripcion,
      gestion: m.gestion, observacion: m.observacion, issues: m.issues,
      total: rows.length, sinError, conError: rows.length - sinError,
      rut: {
        valido: rows.filter(r=>r.rutEstado==='valido').length,
        vacio: rows.filter(r=>r.rutEstado==='vacio').length,
        formato: rows.filter(r=>r.rutEstado==='formato').length,
        dv: rows.filter(r=>r.rutEstado==='dv').length,
      },
    };
  });

  RUT_TOTAL = MODULES.reduce((a,m)=>a+m.total,0);
  RUT_VALIDO = MODULES.reduce((a,m)=>a+m.rut.valido,0);
  RUT_VACIO = MODULES.reduce((a,m)=>a+m.rut.vacio,0);
  RUT_FORMATO = MODULES.reduce((a,m)=>a+m.rut.formato,0);
  RUT_DV = MODULES.reduce((a,m)=>a+m.rut.dv,0);
  RUT_MAL = RUT_VACIO+RUT_FORMATO+RUT_DV;

  GESTION_TOTAL = 0; GESTION_CON = 0; GESTION_SIN = 0; DUP_GRUPOS_TOTAL = 0; PRUEBA_TOTAL = 0;
  for(const rows of Object.values(MASTER_DATA)){
    GESTION_TOTAL += rows.length;
    GESTION_CON += rows.filter(r=>r.estadoGestion && !/SIN/i.test(r.estadoGestion)).length;
    GESTION_SIN += rows.filter(r=>r.estadoGestion && /SIN/i.test(r.estadoGestion)).length;
    DUP_GRUPOS_TOTAL += new Set(rows.filter(r=>r.rutEstado==="valido" && r.repeticionesRut>1).map(r=>r.rut)).size;
    PRUEBA_TOTAL += rows.filter(r=>r.esPrueba).length;
  }
}

function pct(n,d){ return d ? (100*n/d).toFixed(1) : "0.0"; }
function esc(s){ return String(s); }

function sparkRow(t,c,total,sev,opts){
  opts = opts || {};
  const w = Math.max(2, (c/total*100)).toFixed(1);
  const sevColor = `var(--${sev})`;
  const clickable = opts.mod || opts.tipo || opts.kind;
  const attrs = clickable ? `class="issue-row clickable" data-kind="${opts.kind||'rut'}" data-mod="${opts.mod||''}" data-tipo="${opts.tipo||''}" data-sev="${opts.filterSev||''}" data-filter="${opts.filterKey||''}" data-title="${esc(opts.title||t)}"` : `class="issue-row"`;
  return `<div ${attrs}>
    <div class="name">${esc(t)}</div>
    <div class="track"><div class="fill" style="width:${w}%;background:${sevColor}"></div></div>
    <div class="count tabular">${c}</div>
    <div class="pill ${sev}">${SEV_LABEL[sev]}</div>
  </div>`;
}

  const tieneCalidad = (buena+regular+deficiente) > 0;

  const dupRuts = new Set(rows.filter(r=>r.rutEstado==="valido" && r.repeticionesRut>1).map(r=>r.rut));
  const dupRegistros = rows.filter(r=>r.rutEstado==="valido" && r.repeticionesRut>1).length;

  return `

      <div class="val tabular" style="color:var(--critical-ink)">${sin}<small>${pct(sin,total)}%</small></div>
      <div class="hint">Ver el detalle →</div>
    </div>` : ``}
    ${dupRuts.size>0 ? `<div class="kpi clickable" data-kind="master" data-mod="${m.id}" data-filter="rutDuplicado" data-title="RUT duplicados — ${m.nombre}">
      <div class="lbl">RUT duplicados</div>
      <div class="val tabular" style="color:var(--serious-ink)">${dupRuts.size}<small>${dupRegistros} registros</small></div>
      <div class="hint">Ver el detalle →</div>

    ${pruebas>0 ? `<div class="kpi clickable" data-kind="master" data-mod="${m.id}" data-filter="esPrueba" data-title="Registros de prueba — ${m.nombre}">
      <div class="lbl">Filas de prueba detectadas</div>
      <div class="val tabular" style="color:var(--serious-ink)">${pruebas}</div>
      <div class="hint">Ver el detalle →</div>

  <div class="card" style="margin-bottom:14px">
    ${buena ? sparkRow("Buena — se entiende sin problema", buena, total, "good", {kind:"master", mod:m.id, filterKey:"calidadBuena", title:`Calidad Buena — ${m.nombre}`}) : ""}
    ${regular ? sparkRow("Regular — mayúsculas sostenidas, sin tildes o doble espacio", regular, total, "warning", {kind:"master", mod:m.id, filterKey:"calidadRegular", title:`Calidad Regular — ${m.nombre}`}) : ""}
    ${deficiente ? sparkRow("Deficiente — el detalle es muy corto para entender qué se pide", deficiente, total, "critical", {kind:"master", mod:m.id, filterKey:"calidadDeficiente", title:`Calidad Deficiente — ${m.nombre}`}) : ""}
  </div>` : ``}
  <div class="foot-note" style="margin-top:${tieneCalidad?'0':'-4px'};margin-bottom:14px">
    “Con gestión” indica que el caso tiene alguna nota, responsable o respuesta registrada por el equipo — no necesariamente que ya se resolvió, solo que alguien lo tomó. “RUT duplicados” son números de RUT que aparecen en más de un registro dentro de este mismo módulo — revisar antes de gestionar para no duplicar trabajo.
  </div>
  `;
}

  <div class="card">
    ${sparkRow("Formato no reconocible (falta guion, largo inválido, texto en la celda)", RUT_FORMATO, RUT_TOTAL, "serious", {tipo:"formato", title:"RUT con formato no reconocible"})}
    ${sparkRow("Dígito verificador incorrecto", RUT_DV, RUT_TOTAL, "critical", {tipo:"dv", title:"RUT con dígito verificador incorrecto"})}

  </div>

  `;
}

          if(t===0) return `<tr><td>${m.icon} ${m.nombre}</td><td class="mono">0</td><td class="mono" colspan="4" style="color:var(--ink-3)">Sin solicitudes en ${mesLabel}</td></tr>`;
          return `<tr>
            <td>${m.icon} ${m.nombre}</td>
            <td class="mono">${t}</td>
            <td class="mono ${sg>0?'clickable':''}" ${sg>0?`data-kind="master" data-filter="agostoSinGestion" data-mod="${m.id}" data-title="Sin gestión — ${m.nombre}, ${mesLabel}"`:''} style="${sg>0?'color:var(--critical-ink);font-weight:700;text-decoration:underline;cursor:pointer':''}">${sg}</td>
            <td class="mono ${rd>0?'clickable':''}" ${rd>0?`data-kind="master" data-filter="agostoRutDuplicado" data-mod="${m.id}" data-title="RUT duplicados — ${m.nombre}, ${mesLabel}"`:''} style="${rd>0?'color:var(--serious-ink);font-weight:700;text-decoration:underline;cursor:pointer':''}">${rd}</td>
            <td class="mono ${rm>0?'clickable':''}" ${rm>0?`data-kind="master" data-filter="agostoRutMal" data-mod="${m.id}" data-title="RUT mal escritos — ${m.nombre}, ${mesLabel}"`:''} style="${rm>0?'color:var(--critical-ink);font-weight:700;text-decoration:underline;cursor:pointer':''}">${rm}</td>
            <td class="mono">${reg+def}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>
  <div class="foot-note">
    “Sin gestión registrada”, “RUT que se repiten” y “Calidad de la redacción” usan la misma información que ya viene en la auditoría del archivo — acá solo se filtra a las solicitudes cuya fecha de ingreso cae en ${mesLabel} de ${REPORT_ANIO}. Haz clic en cualquier número para ver el detalle, incluido el RUT.
  </div>
  `;
}

function renderJefatura(){
  const allRows = [];
  for(const [mod, rows] of Object.entries(MASTER_DATA)){
    rows.forEach(r => allRows.push({...r, _mod: mod}));
  }
  const total = allRows.length;

  const catCounts = {};
  allRows.forEach(r=>{
    const cat = (r.servicio||"").trim() || "(sin categoría)";
    catCounts[cat] = (catCounts[cat]||0)+1;
  });
  const catList = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);
  const maxCat = catList.length ? catList[0][1] : 1;
  const topCat = catList[0] || ["—",0];

  const canalCounts = {};
  allRows.forEach(r=>{
    const canal = (r.paciente||"").trim() || "(sin dato)";
    canalCounts[canal] = (canalCounts[canal]||0)+1;
  });
  const canalList = Object.entries(canalCounts).sort((a,b)=>b[1]-a[1]);
  const maxCanal = canalList.length ? canalList[0][1] : 1;
  const topCanal = canalList[0] || ["—",0];

  const porModulo = MODULES.map(m=>{
    const rows = allRows.filter(r=>r._mod===m.id);
    const counts = {};
    rows.forEach(r=>{ const c=(r.servicio||"").trim()||"(sin categoría)"; counts[c]=(counts[c]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0] || null;
    return {m, total: rows.length, top};
  });

  return `
  <div class="lede">Vista pensada para jefatura: agrupa todas las solicitudes de las 5 áreas por <b>categoría o motivo de la solicitud</b> y por <b>canal de ingreso</b>, para ver de un vistazo qué está llegando más y dónde conviene reforzar el flujo. Los errores de RUT y la calidad de la redacción se siguen viendo en cada módulo y en "Auditoría de RUT" — esta vista es solo para lectura rápida de volumen.</div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Total de solicitudes</div><div class="val tabular">${total}</div></div>
    <div class="kpi"><div class="lbl">Categoría más solicitada</div><div class="val" style="font-size:19px; line-height:1.25;">${esc(topCat[0])}</div><div class="hint">${topCat[1]} solicitudes · ${pct(topCat[1],total)}%</div></div>
    <div class="kpi"><div class="lbl">Canal más usado</div><div class="val" style="font-size:19px; line-height:1.25;">${esc(topCanal[0])}</div><div class="hint">${topCanal[1]} solicitudes · ${pct(topCanal[1],total)}%</div></div>
    <div class="kpi"><div class="lbl">Categorías distintas</div><div class="val tabular">${catList.length}</div></div>
  </div>

  <div class="section-title">Volumen por categoría de solicitud <span class="n">— las 5 áreas juntas, clic para ver el detalle</span></div>
  <div class="card">
    ${catList.map(([cat,c])=>`
      <div class="issue-row clickable" data-kind="master" data-mod="" data-filter="categoria" data-cat="${esc(cat)}" data-title="${esc(cat)} — todos los módulos">
        <div class="name">${esc(cat)}</div>
        <div class="track"><div class="fill" style="width:${Math.max(2,(c/maxCat*100)).toFixed(1)}%;background:var(--accent)"></div></div>
        <div class="count tabular">${c}</div>
        <div class="pill good">${pct(c,total)}%</div>
      </div>
    `).join("")}
  </div>

  <div class="section-title">Categoría principal por módulo <span class="n">— qué motivo predomina en cada flujo</span></div>
  <div class="card pad">
    <table class="rutdef">
      <thead><tr><th>Módulo</th><th>Solicitudes</th><th>Categoría principal</th><th>% del módulo</th></tr></thead>
      <tbody>
        ${porModulo.map(({m,total:t,top})=>{
          if(!top || t===0) return `<tr><td>${m.icon} ${m.nombre}</td><td class="mono">0</td><td colspan="2" style="color:var(--ink-3)">Sin solicitudes</td></tr>`;
          return `<tr class="clickable" data-kind="master" data-mod="${m.id}" data-filter="categoria" data-cat="${esc(top[0])}" data-title="${esc(top[0])} — ${m.nombre}">
            <td>${m.icon} ${m.nombre}</td>
            <td class="mono">${t}</td>
            <td>${esc(top[0])}</td>
            <td class="mono">${pct(top[1],t)}%</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>

  <div class="section-title">Canal de ingreso <span class="n">— quién hace la solicitud, clic para ver el detalle</span></div>
  <div class="card">
    ${canalList.map(([canal,c])=>`
      <div class="issue-row clickable" data-kind="master" data-mod="" data-filter="canal" data-cat="${esc(canal)}" data-title="${esc(canal)} — todos los módulos">
        <div class="name">${esc(canal)}</div>
        <div class="track"><div class="fill" style="width:${Math.max(2,(c/maxCanal*100)).toFixed(1)}%;background:var(--accent)"></div></div>
        <div class="count tabular">${c}</div>
        <div class="pill good">${pct(c,total)}%</div>
      </div>
    `).join("")}
  </div>

  <div class="foot-note">Esta vista agrupa por la categoría de servicio y el canal de ingreso que quedaron registrados en cada solicitud, cruzando las 5 áreas. Haz clic en cualquier categoría, módulo o canal para ver el listado de casos, incluido el RUT.</div>
  `;
}

function build(){
  const TABS = [
    {id:"resumen", label:"Resumen general", icon:"📊", render:renderResumen, count:null},
    {id:"agosto", label:`Análisis de ${MES_NOMBRE[REPORT_MES][0].toUpperCase()+MES_NOMBRE[REPORT_MES].slice(1)}`, icon:"📅", render:renderAgosto, count:null},
    ...MODULES.map(m=>({id:m.id, label:m.nombre, icon:m.icon, render:()=>renderModulePanel(m), count:m.conError})),
    {id:"rut", label:"Auditoría de RUT", icon:"🪪", render:renderRutTab, count:RUT_MAL},
    {id:"jefatura", label:"Análisis Jefatura", icon:"📈", render:renderJefatura, count:null},
  ];

  const nav = document.getElementById("railNav");
  nav.innerHTML = TABS.map(t=>`
    <button class="rail-btn" data-tab="${t.id}">
      <span class="ic">${t.icon}</span><span>${t.label}</span>
      ${t.count!==null ? `<span class="cnt tabular">${t.count}</span>` : ``}
    </button>
  `).join("");

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="topbar">
      <h1 id="pageTitle"></h1>
      <div class="ref">Fecha de referencia del análisis: 15‑08‑2026</div>
    </div>
    ${TABS.map(t=>`<div class="panel" id="panel-${t.id}"></div>`).join("")}
  `;

  TABS.forEach(t=>{ document.getElementById(`panel-${t.id}`).innerHTML = t.render(); });

  function show(id){
    TABS.forEach(t=>{
      document.getElementById(`panel-${t.id}`).classList.toggle("active", t.id===id);
    });
    document.querySelectorAll(".rail-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab===id));
    document.getElementById("pageTitle").textContent = TABS.find(t=>t.id===id).label;
  }

  nav.addEventListener("click", e=>{
    const btn = e.target.closest(".rail-btn");
    if(!btn) return;
    show(btn.dataset.tab);
  });

  show("resumen");
}

async function init(){
  const main = document.getElementById("main");
  main.innerHTML = `<div style="padding:60px 0; text-align:center; color:var(--ink-3); font-size:14px;">Cargando datos desde la base…</div>`;
  try{
    const res = await fetch("/api/dashboard-data", {credentials:"same-origin"});
    if(res.status === 401){ location.href = "/login"; return; }
    if(!res.ok) throw new Error("HTTP " + res.status);
    const payload = await res.json();
    deriveData(payload);
    build();
  } catch(err){
    main.innerHTML = `<div style="padding:60px 20px; text-align:center; color:var(--critical-ink);">
      No se pudieron cargar los datos del panel.<br><span style="color:var(--ink-3); font-size:13px;">${esc(err.message||err)}</span>
      <div style="margin-top:16px;"><button onclick="init()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;">Reintentar</button></div>
    </div>`;
  }
}
init();

/* ---------- RUT detail modal ---------- */
const overlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalSubtitle = document.getElementById("modalSubtitle");
const modalBody = document.getElementById("modalBody");
const modalFoot = document.getElementById("modalFoot");

function openRutModal(mod, tipo, title){
  document.getElementById("modalHead").innerHTML = `<tr><th>Módulo</th><th>Fila en base</th><th>Nombre</th><th>RUT ingresado</th><th>Error</th><th>Corrección sugerida</th></tr>`;
  const items = BAD_RUTS.filter(r => (!mod || r.mod===mod) && (!tipo || r.tipo===tipo));
  modalTitle.textContent = title || "RUT mal escritos";
  modalSubtitle.textContent = `${items.length} caso${items.length===1?'':'s'} — dato mostrado solo para corrección directa en la base interna.`;
  modalBody.innerHTML = items.map(r => `
    <tr data-fila="${r.fila}" data-mod="${r.mod}">
      <td>${r.modLabel}</td>
      <td class="mono">${r.fila}</td>
      <td>${esc(r.nombre)}</td>
      <td class="mono">${esc(r.rut)}</td>
      <td><span class="pill ${TIPO_SEV[r.tipo]}">${TIPO_LABEL[r.tipo]}</span></td>
      <td class="mono ${r.sugerencia?'fix':'arrow'}">${r.sugerencia ? '→ '+r.sugerencia : '— revisar manualmente'}</td>
    </tr>
  `).join("") || `<tr><td colspan="6" style="padding:20px 22px;color:var(--ink-3)">Sin casos para este filtro.</td></tr>`;
  modalFoot.textContent = "Haz clic en un caso para ver el detalle completo, incluido el RUT, y abrir la planilla en esa fila.";
  overlay.classList.add("open");
}

function closeRutModal(){ overlay.classList.remove("open"); }

/* ---------- Mes actual (para el módulo "Análisis de Agosto") ---------- */
const REPORT_MES = 8, REPORT_ANIO = 2026;
function esDelMes(r, mes, anio){
  if(!r.ingreso) return false;
  const partes = r.ingreso.split("-");
  if(partes.length !== 3) return false;
  return Number(partes[1]) === mes && Number(partes[2]) === anio;
}

/* ---------- Listas genéricas sobre MASTER_DATA (todo registro, filtrado) ---------- */
const MASTER_FILTERS = {
  total: r => true,
  sinError: r => r.incOk,
  conError: r => !r.incOk,
  rutValido: r => r.rutEstado === "valido",
  gestionCon: r => r.estadoGestion && !/SIN/i.test(r.estadoGestion),
  gestionSin: r => r.estadoGestion && /SIN/i.test(r.estadoGestion),
  calidadBuena: r => r.calidadTexto === "Buena",
  calidadRegular: r => r.calidadTexto === "Regular",
  calidadDeficiente: r => r.calidadTexto === "Deficiente",
  rutDuplicado: r => r.repeticionesRut && r.repeticionesRut > 1 && r.rutEstado === "valido",
  esPrueba: r => r.esPrueba,
  agostoTotal: r => esDelMes(r, REPORT_MES, REPORT_ANIO),
  agostoSinGestion: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.estadoGestion && /SIN/i.test(r.estadoGestion),
  agostoRutDuplicado: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.repeticionesRut && r.repeticionesRut > 1 && r.rutEstado === "valido",
  agostoRutMal: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.rutEstado !== "valido",
  agostoCalidadBuena: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.calidadTexto === "Buena",
  agostoCalidadRegular: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.calidadTexto === "Regular",
  agostoCalidadDeficiente: r => esDelMes(r, REPORT_MES, REPORT_ANIO) && r.calidadTexto === "Deficiente",
};

function rowMeta(filterKey, r){
  if(filterKey==="rutValido") return {text:"RUT válido", sev:"good"};
  if(filterKey==="gestionCon" || filterKey==="gestionSin") return {text: r.estadoGestion || "—", sev: (filterKey==="gestionCon"?"good":"critical")};
  if(filterKey==="calidadBuena") return {text:"Buena", sev:"good"};
  if(filterKey==="calidadRegular") return {text:"Regular"+[r.todoMayusculas&&" · mayúsculas",r.dobleEspacio&&" · doble espacio",r.faltaTilde&&" · sin tilde"].filter(Boolean).join(""), sev:"warning"};
  if(filterKey==="calidadDeficiente") return {text:"Deficiente (detalle muy corto o vacío)", sev:"critical"};
  if(filterKey==="rutDuplicado") return {text:`Se repite ${r.repeticionesRut} veces`, sev:"serious"};
  if(filterKey==="esPrueba") return {text:"Registro de prueba/dummy", sev:"serious"};
  if(filterKey==="agostoTotal") return {text: r.incTexto || "—", sev: r.incOk ? "good" : "critical"};
  if(filterKey==="agostoSinGestion") return {text: r.estadoGestion || "Sin gestión", sev:"critical"};
  if(filterKey==="agostoRutDuplicado") return {text:`RUT se repite ${r.repeticionesRut} veces`, sev:"serious"};
  if(filterKey==="agostoRutMal") return {text: TIPO_LABEL[r.rutEstado] || "RUT mal escrito", sev: TIPO_SEV[r.rutEstado] || "serious"};
  if(filterKey==="agostoCalidadBuena") return {text:"Buena", sev:"good"};
  if(filterKey==="agostoCalidadRegular") return {text:"Regular"+[r.todoMayusculas&&" · mayúsculas",r.dobleEspacio&&" · doble espacio",r.faltaTilde&&" · sin tilde"].filter(Boolean).join(""), sev:"warning"};
  if(filterKey==="agostoCalidadDeficiente") return {text:"Deficiente (detalle muy corto o vacío)", sev:"critical"};
  if(filterKey==="categoria" || filterKey==="canal"){
    const sinGestion = r.estadoGestion && /SIN/i.test(r.estadoGestion);
    return {text: r.estadoGestion || "Sin dato de gestión", sev: sinGestion ? "critical" : "good"};
  }
  // total / sinError / conError
  return {text: r.incTexto || "—", sev: r.incOk ? "good" : "critical"};
}

function openMasterList(mod, filterKey, title, extra){
  let pred;
  if(filterKey === "categoria"){
    pred = r => ((r.servicio||"").trim() || "(sin categoría)") === extra;
  } else if(filterKey === "canal"){
    pred = r => ((r.paciente||"").trim() || "(sin dato)") === extra;
  } else {
    pred = MASTER_FILTERS[filterKey] || (()=>true);
  }
  let items = [];
  if(mod){
    items = (MASTER_DATA[mod] || []).filter(pred).map(r => ({...r, _mod: mod}));
  } else {
    for(const [mid, rows] of Object.entries(MASTER_DATA)){
      rows.filter(pred).forEach(r => items.push({...r, _mod: mid}));
    }
  }
  items.sort((a,b)=> a._mod===b._mod ? a.fila-b.fila : a._mod.localeCompare(b._mod));

  document.getElementById("modalHead").innerHTML = `<tr>${mod?'':'<th>Módulo</th>'}<th>Fila en base</th><th>Nombre</th><th>Servicio</th><th>Fecha de ingreso</th><th>Estado</th></tr>`;
  modalTitle.textContent = title || "Registros";
  modalSubtitle.textContent = `${items.length} caso${items.length===1?'':'s'} — haz clic en uno para ver el detalle completo, incluido el RUT.`;
  modalBody.innerHTML = items.map(r => {
    const meta = rowMeta(filterKey, r);
    return `<tr data-fila="${r.fila}" data-mod="${r._mod}">
      ${mod?'':`<td>${MOD_LABEL[r._mod]}</td>`}
      <td class="mono">${r.fila}</td>
      <td>${esc(r.nombre)}</td>
      <td style="color:var(--ink-2)">${esc(r.servicio||'—')}</td>
      <td class="mono">${r.ingreso || '— sin registrar'}</td>
      <td><span class="pill ${meta.sev}">${esc(meta.text)}</span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="${mod?5:6}" style="padding:20px 22px;color:var(--ink-3)">Sin casos para este filtro.</td></tr>`;
  modalFoot.textContent = "Haz clic en un caso para ver el detalle completo, incluido el RUT, y abrir la planilla en esa fila.";
  overlay.classList.add("open");
}

/* ---------- Detalle de un registro puntual (incluye RUT + botón a la planilla) ---------- */
const recordOverlay = document.getElementById("recordOverlay");
const recordEyebrow = document.getElementById("recordEyebrow");
const recordTitle = document.getElementById("recordTitle");
const recordFields = document.getElementById("recordFields");
const recordFoot = document.getElementById("recordFoot");
const recordExcelBtn = document.getElementById("recordExcelBtn");

const RUT_ESTADO_LABEL = {valido:"Válido", vacio:"Campo vacío", formato:"Formato no reconocible", dv:"Dígito verificador incorrecto"};
const RUT_ESTADO_SEV = {valido:"good", vacio:"warning", formato:"serious", dv:"critical"};

function fieldRow(label, valueHtml){
  return `<div class="row"><dt>${label}</dt><dd>${valueHtml}</dd></div>`;
}

function openRecordModal(mod, fila){
  const r = (MASTER_DATA[mod]||[]).find(x => x.fila === Number(fila));
  if(!r) return;
  recordEyebrow.textContent = `${MOD_LABEL[mod]} · Fila ${r.fila}`;
  recordTitle.textContent = r.nombre;

  const rutHtml = r.rut
    ? `${esc(r.rut)} <span class="pill ${RUT_ESTADO_SEV[r.rutEstado]}" style="margin-left:6px">${RUT_ESTADO_LABEL[r.rutEstado]}</span>${r.rutSugerencia ? ` <span style="color:var(--good-ink);font-weight:700">→ ${r.rutSugerencia}</span>` : ``}`
    : `<span class="muted">— sin registrar</span> <span class="pill warning" style="margin-left:6px">Campo vacío</span>`;

  recordFields.innerHTML = [
    fieldRow("RUT", rutHtml),
    fieldRow("Correo", r.correo ? esc(r.correo) : `<span class="muted">— sin registrar</span>`),
    fieldRow("Servicio", r.servicio ? esc(r.servicio) : `<span class="muted">—</span>`),
    fieldRow("Canal", r.paciente ? esc(r.paciente) : `<span class="muted">—</span>`),
    fieldRow("Ejecutivo", r.ejecutivo ? esc(r.ejecutivo) : `<span class="muted">—</span>`),
    r.estadoBO ? fieldRow("Estado de gestión", esc(r.estadoBO)) : "",
    fieldRow("Fecha de ingreso", (r.ingreso || `<span class="muted">— sin registrar</span>`) + (r.ingresoSugerido ? ` <span style="color:var(--good-ink);font-weight:700">→ ${r.ingresoSugerido}</span>`:``)),
    r.atencion ? fieldRow("Fecha de atención", r.atencion) : "",
    fieldRow("Inconsistencia de fecha", r.incTexto ? `<span class="pill ${r.incOk?'good':'critical'}">${esc(r.incTexto)}</span>` : `<span class="muted">—</span>`),
  ].join("");

  recordFoot.textContent = `Hoja ${SHEET_NAME[mod]}, fila ${r.fila} en el archivo fuente.`;
  recordExcelBtn.href = buildExcelLink(mod, r.fila);
  recordOverlay.classList.add("open");
}
function closeRecordModal(){ recordOverlay.classList.remove("open"); }

document.addEventListener("click", e=>{
  // 1) clic en una fila de una lista -> abre el detalle del registro puntual
  const row = e.target.closest("tr[data-fila]");
  if(row){
    openRecordModal(row.dataset.mod, row.dataset.fila);
    return;
  }
  // 2) clic en un recuadro/KPI clicable -> abre la lista correspondiente
  const trigger = e.target.closest("[data-title]");
  if(trigger && overlay.contains(trigger)===false){
    if(trigger.dataset.kind === "master"){
      openMasterList(trigger.dataset.mod, trigger.dataset.filter || "total", trigger.dataset.title, trigger.dataset.cat);
    } else {
      openRutModal(trigger.dataset.mod || null, trigger.dataset.tipo || null, trigger.dataset.title);
    }
    return;
  }
  if(e.target === overlay) closeRutModal();
  if(e.target === recordOverlay) closeRecordModal();
});
document.getElementById("modalClose").addEventListener("click", closeRutModal);
document.getElementById("recordClose").addEventListener("click", closeRecordModal);
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeRecordModal(); closeRutModal(); }
});
</script>
