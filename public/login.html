<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Auditoría SNL Progesys</title>
<style>
  :root{
    --page:#f7f6f2; --surface:#ffffff; --ink:#16201f; --ink-2:#52625f;
    --border:rgba(22,32,31,0.12); --accent:#0f6b62; --accent-ink:#ffffff;
    --critical:#d03b3b; --critical-soft:#fbe1e1; --critical-ink:#a12222;
    --shadow:0 1px 2px rgba(16,25,24,0.06), 0 8px 24px -12px rgba(16,25,24,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root{ --page:#0d1211; --surface:#141b1a; --ink:#eef4f2; --ink-2:#b9c6c3; --border:rgba(255,255,255,0.10); --accent:#3fb3a4; --accent-ink:#04211d; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);
    padding:36px 32px; width:100%; max-width:360px;
  }
  .mark{
    width:40px; height:40px; border-radius:10px; background:linear-gradient(155deg,#3fb3a4,#0f6b62);
    display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:16px;
  }
  h1{ font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:21px; margin:0 0 4px; }
  p.sub{ font-size:13px; color:var(--ink-2); margin:0 0 24px; line-height:1.5; }
  label{ font-size:12px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:6px; }
  input[type="password"]{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border);
    background:var(--page); color:var(--ink); font-size:14px; margin-bottom:16px;
  }
  input[type="password"]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{
    width:100%; padding:11px; border:none; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    font-size:14px; font-weight:700; cursor:pointer;
  }
  button:hover{ opacity:.92; }
  .error{
    background:var(--critical-soft); color:var(--critical-ink); font-size:12.5px; font-weight:600;
    padding:9px 12px; border-radius:8px; margin-bottom:16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🩺</div>
    <h1>Auditoría SNL</h1>
    <p class="sub">Panel interno de Progesys. Ingresa la contraseña del equipo para continuar.</p>
    <div id="errorBox" class="error" style="display:none;">Contraseña incorrecta. Intenta de nuevo.</div>
    <form method="POST" action="/login">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("errorBox").style.display = "block";
    }
  </script>
</body>
</html>
